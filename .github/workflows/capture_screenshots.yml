name: Capture iOS Simulator Screenshots

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'iPhone Simulator Device Name'
        required: false
        default: 'iPhone 16 Pro Max'
        type: string

jobs:
  capture-iphone:
    name: Capture iPhone Screenshots
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python & Pillow
        run: |
          python3 -m pip install --upgrade --break-system-packages pillow

      - name: Prepare Flutter Dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Boot iPhone Simulator
        id: boot-iphone
        run: |
          REQ_DEVICE="${{ github.event.inputs.device || 'iPhone 16 Pro Max' }}"
          echo "Looking for: $REQ_DEVICE"

          SIM_UUID=$(xcrun simctl list devices available | grep -m 1 "$REQ_DEVICE" | awk -F '[()]' '{print $2}')
          [ -z "$SIM_UUID" ] && SIM_UUID=$(xcrun simctl list devices available | grep -m 1 "iPhone 15 Pro Max" | awk -F '[()]' '{print $2}')
          [ -z "$SIM_UUID" ] && SIM_UUID=$(xcrun simctl list devices available | grep -m 1 "iPhone 16" | awk -F '[()]' '{print $2}')
          [ -z "$SIM_UUID" ] && SIM_UUID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | awk -F '[()]' '{print $2}')

          echo "Selected UUID: $SIM_UUID"
          echo "sim_uuid=$SIM_UUID" >> $GITHUB_OUTPUT

          xcrun simctl boot "$SIM_UUID"
          xcrun simctl bootstatus "$SIM_UUID" -b

          # Clean Apple-standard status bar
          xcrun simctl status_bar "$SIM_UUID" override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100

      - name: Run Integration Test & Capture Screenshots
        run: |
          SIM_UUID="${{ steps.boot-iphone.outputs.sim_uuid }}"
          mkdir -p output/screenshots

          # Run integration test in background
          flutter test integration_test/screenshot_walkthrough_test.dart -d "$SIM_UUID" &
          TEST_PID=$!

          # The Xcode build takes ~4 minutes. The test then runs for ~2 minutes.
          # We take screenshots every 8 seconds starting at 4:30 to cover the full test run.
          # This gives us ~25 screenshots across the entire user flow.

          echo "Waiting 270 seconds for Xcode build to complete..."
          sleep 270

          echo "Starting screenshot capture sequence..."
          for i in $(seq -w 1 30); do
            xcrun simctl io "$SIM_UUID" screenshot "output/screenshots/shot_${i}.png" 2>/dev/null && echo "Captured shot_${i}" || true
            sleep 8
          done

          echo "Waiting for integration test to finish..."
          wait $TEST_PID 2>/dev/null || true

          echo "All screenshots captured:"
          ls -lh output/screenshots/

      - name: Shutdown iPhone Simulator
        if: always()
        run: |
          xcrun simctl shutdown "${{ steps.boot-iphone.outputs.sim_uuid }}" || true

      - name: Process Screenshots (Strip Alpha for App Store)
        if: always()
        run: |
          python3 - << 'PYEOF'
          import os, glob
          from PIL import Image

          src = "output/screenshots"
          dst_67 = "output/appstore_6_7_inch"
          dst_65 = "output/appstore_6_5_inch"
          os.makedirs(dst_67, exist_ok=True)
          os.makedirs(dst_65, exist_ok=True)

          for f in sorted(glob.glob(f"{src}/*.png")):
              fname = os.path.basename(f)
              try:
                  with Image.open(f) as img:
                      rgb = img.convert("RGB")
                      # Save full-res (6.7" / 6.9")
                      rgb.save(os.path.join(dst_67, fname), "PNG")
                      # Scale to 6.5" (1242x2688)
                      scaled = rgb.resize((1242, 2688), Image.Resampling.LANCZOS)
                      scaled.save(os.path.join(dst_65, fname), "PNG")
                      print(f"OK: {fname} {rgb.size}")
              except Exception as e:
                  print(f"ERR: {fname}: {e}")
          PYEOF

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agrodisha-appstore-screenshots
          path: output/
          if-no-files-found: warn
