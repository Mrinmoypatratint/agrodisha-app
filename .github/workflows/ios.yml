name: iOS Build and Release

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fastlane lane to execute'
        required: true
        default: 'build_ios'
        type: choice
        options:
          - build_ios   # Phase 13: Build & Sign IPA for CI validation (no upload)
          - beta        # Phase 15: Build, Sign & Upload directly to TestFlight
          - release     # Phase 20: Build, Sign & Upload to App Store Connect

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Xcode and SDK versions
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: |
          flutter --version

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies via Bundler
        run: |
          bundle install

      - name: Execute Fastlane
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          LANE="${{ github.event.inputs.lane || 'build_ios' }}"
          echo "Executing Fastlane lane: $LANE"
          bundle exec fastlane ios $LANE

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
