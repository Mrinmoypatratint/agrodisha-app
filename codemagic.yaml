workflows:
  ios-test-build:
    name: iOS Build Test (No Signing Required)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (Force CocoaPods)
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Precache iOS artifacts
        script: |
          flutter precache --ios
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS (Simulator / No Codesign)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: iOS App Store Release & Publish
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.agrohisha.app"
    scripts:
      - name: Disable Swift Package Manager (Force CocoaPods)
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Precache iOS artifacts
        script: |
          flutter precache --ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - rajbsmv@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

